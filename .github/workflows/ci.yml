name: atlas-ci

on:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'atlas/**'
      - '.github/workflows/ci.yml'

# T088: cancel superseded runs to avoid burning runner minutes on rapid pushes.
# Groups by workflow + ref; on a feature branch every new push cancels the prior
# run; on main the in-progress run finishes (concurrent main pushes are rare).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: atlas

jobs:
  # Cheapest gate — runs in <10s on cold cache. Catches missing
  # runtime='edge' exports, malformed env vars (against the placeholder
  # values), JWT-shaped key validation. Fails fast before lint/build
  # waste runner time.
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run preflight
        env:
          # Placeholder values just to pass shape checks; real values
          # only live in the CF dashboard. Uses the new sb_* handle
          # format (both formats are accepted by the script).
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder_for_ci
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder_for_ci
          AUDIT_HASH_SALT: ci-placeholder-salt-32-chars-min

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Stub: integration tests require a live Supabase test branch + a test
  # user. Owner invites + test-user provisioning are deferred indefinitely
  # (per Viktor 2026-05-26) — re-enable when a Supabase preview branch is
  # wired into CI. Until then, repo/service logic is covered by unit tests.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests (deferred — no CI Supabase branch)
        run: |
          echo "Integration tests need a CI-accessible Supabase branch + test user."
          echo "Wire in when one exists; unit tests cover repo/service logic today."
          exit 0

  # Golden-master tests: assert byte-equivalent output between the TS calc
  # engine port and the original vanilla `public/engine.js`. Covers 10
  # project fixtures + 9 portfolio fixtures + the Excel-parity smoke test.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run tests/golden/ tests/smoke/

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Lighthouse CI (T075): perf + a11y budgets on the public surface.
  # Only /sign-in is unauthenticated, so it's the only target we can
  # score without provisioning a test user.
  #
  # Strategy: start the Next.js server in a `run:` step (which inherits
  # defaults.run.working-directory: atlas and correctly finds the binary
  # in atlas/node_modules/.bin/), wait for port 3001, then run LHCI in
  # collect-only mode (no startServerCommand — server is already up).
  #
  # The NEXT_PUBLIC_* env vars are intentionally NOT set for the server-
  # start step — the middleware's `!url || !key` guard fires immediately,
  # the sign-in page serves without any Supabase network round-trip, and
  # Lighthouse measures a fast, clean page load.
  #
  # Asserts (see atlas/lighthouserc.json):
  #   - performance     ≥ 80  (error)
  #   - accessibility   ≥ 90  (error)
  #   - best-practices  ≥ 85  (warn)
  #   - seo             ≥ 80  (warn)
  lighthouse:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder_for_ci
      # Start the server in the background. `run:` inherits
      # working-directory: atlas, so pnpm exec finds next in
      # atlas/node_modules/.bin/. NEXT_PUBLIC_* vars deliberately omitted
      # so the middleware early-returns and serves sign-in immediately.
      - name: Start Next.js server (background)
        run: pnpm exec next start -p 3001 &
      # Wait until port 3001 is accepting connections (typically < 3s).
      - name: Wait for port 3001
        run: |
          timeout 30 bash -c 'until nc -z localhost 3001; do sleep 0.5; done'
          echo "Server ready on port 3001"
      - name: Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: atlas/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # Playwright e2e (V7 QA pass): the no-auth surface — middleware parking +
  # absorbed 301s + tab redirects + endpoint gating + the sign-in specs.
  # Auth-dependent journeys self-skip (no test user in CI). Added because
  # 4 broken specs sat invisible for weeks with no e2e job in CI.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
        env:
          CI: 'true'

  # Cloudflare Pages adapter build — catches edge-runtime regressions
  # before Cloudflare's own build pipeline runs. Doesn't deploy; the
  # actual deploy is triggered by Cloudflare's GitHub integration.
  #
  # Uses pages:build:ci (pnpm build + next-on-pages, no preflight:remote)
  # because the dedicated `preflight` job above already covers local checks,
  # and the remote checks (Supabase schema exposure, CF nodejs_compat) need
  # real secrets that CI doesn't carry. Running preflight:remote with
  # placeholder env caused 4 hard failures before next-on-pages even ran.
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pages:build:ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_placeholder_for_ci
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_placeholder_for_ci
          AUDIT_HASH_SALT: ci-placeholder-salt-32-chars-min
