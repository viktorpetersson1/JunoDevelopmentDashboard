name: atlas-ci

on:
  push:
    branches: [main]
    paths:
      - 'atlas/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'atlas/**'
      - '.github/workflows/ci.yml'

defaults:
  run:
    working-directory: atlas

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # Stub: integration tests require a live Supabase test branch (no CI access
  # yet). Will be wired in T076 when production / preview DBs land.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integration tests (deferred to T076)
        run: |
          echo "Integration tests will run against a CI-accessible Supabase"
          echo "branch once T076 (production deploy) provisions one."
          echo "Tracking ticket: T076."
          exit 0

  # Stub: golden-master tests compare TS calc engine outputs to the vanilla
  # JS engine snapshots. Land in T032' / T033' / T034' once seed data exists.
  golden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Golden-master tests (deferred to T034')
        run: |
          echo "Golden-master tests compare lib/calc/* outputs against the"
          echo "vanilla JS engine snapshots. Land in T032'-T034' (calc port)."
          echo "Tracking ticket: T032'-T034'."
          exit 0

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Cloudflare Pages adapter build — catches edge-runtime regressions
  # before Cloudflare's own build pipeline runs. Doesn't deploy; the
  # actual deploy is triggered by Cloudflare's GitHub integration.
  pages-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: atlas/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run pages:build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
